name: Build Test Publish and Deploy (demo)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run unit tests
        run: mvn -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Angular
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build
  fraud-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Partie H dependencies
        working-directory: fraud
        run: python -m pip install -r requirements.txt
      - name: Test Data Science pipeline (synthetic fixtures, not study metrics)
        working-directory: fraud
        run: python -m pytest -q test_train.py
  images:
    needs: [verify, fraud-tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [discovery-service,config-service,gateway-service,account-service,transaction-service,event-consumer-service,ai-agent-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/adria-${{ matrix.module }}:${{ github.sha }}
  deploy-example:
    needs: images
    runs-on: ubuntu-latest
    if: false # EXAMPLE ONLY: activate after setting up an environment and secrets
    steps:
      - run: echo 'Pull pinned container image digests and run docker compose up -d on target host'
