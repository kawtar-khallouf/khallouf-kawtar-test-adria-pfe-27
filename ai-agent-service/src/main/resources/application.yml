server:
  port: 8083
spring:
  application:
    name: ai-agent-service
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
    mcp:
      client:
        enabled: ${MCP_ENABLED:true}
        type: SYNC
        sse:
          connections:
            accounts:
              url: ${ACCOUNT_MCP_URL:http://localhost:8081}
            transactions:
              url: ${TRANSACTION_MCP_URL:http://localhost:8082}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/bank}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8085/realms/bank/protocol/openid-connect/certs}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
bank:
  security:
    enabled: ${BANK_SECURITY_ENABLED:true}
