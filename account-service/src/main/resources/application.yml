server:
  port: 8081
spring:
  application:
    name: account-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1}
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  graphql:
    graphiql:
      enabled: true
  ai:
    mcp:
      server:
        name: ${spring.application.name}
        type: SYNC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/bank}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8085/realms/bank/protocol/openid-connect/certs}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
bank:
  transaction:
    max-amount: 1000
  security:
    enabled: ${BANK_SECURITY_ENABLED:true}
